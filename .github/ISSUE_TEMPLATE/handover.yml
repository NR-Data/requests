name: Hand over a repository
description: Head maintainers only. Make someone else the head maintainer.
title: "Hand over: "
labels: [handover]
body:
  - type: input
    id: repo
    attributes:
      label: Repository name
    validations:
      required: true
  - type: input
    id: new_head
    attributes:
      label: New head maintainer
      description: Their GitHub username, without @
    validations:
      required: true
