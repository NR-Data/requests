name: Requests
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  # Auto-approves join requests whose head maintainer did not answer in time
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  handle:
    if: github.event_name != 'issue_comment' || (!github.event.issue.pull_request && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: NR-Data
      # Issue text is only ever read from context.payload, never interpolated into the script
      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: return require('./scripts/handle.js')({ github, context, core })
